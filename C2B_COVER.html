<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2B — DRB</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard',system-ui,sans-serif;
  background:#F8F7F5;
  color:#1A1A1A;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

.blob{position:fixed;pointer-events:none;border-radius:50%}
.b1{width:560px;height:560px;top:-180px;right:-140px;
    background:radial-gradient(ellipse,rgba(227,29,56,.06) 0%,transparent 70%)}
.b2{width:360px;height:360px;bottom:-100px;left:-80px;
    background:radial-gradient(ellipse,rgba(140,119,80,.05) 0%,transparent 70%)}

.frame{
  position:fixed;inset:24px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:28px;
  pointer-events:none;
}

.center{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:flex-start;
  padding:0 48px;
  max-width:600px;
  width:100%;
  animation:up .75s cubic-bezier(.16,1,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

.wordmark{
  font-size:11px;font-weight:800;letter-spacing:.22em;
  text-transform:uppercase;color:#BDBBB9;
  margin-bottom:52px;
  display:flex;align-items:center;gap:12px;
}
.wordmark::after{content:'';width:28px;height:1px;background:#E0DFDD}

.title{
  font-size:clamp(72px,10vw,108px);
  font-weight:900;letter-spacing:-.07em;line-height:.9;
  color:#1A1A1A;
}
.title em{color:#E31D38;font-style:normal}

.row{
  display:flex;align-items:center;gap:14px;
  margin:22px 0 32px;
}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#BDBBB9}
.arrow{
  display:flex;align-items:center;
  width:36px;height:1px;background:#E31D38;position:relative;
}
.arrow::after{
  content:'';position:absolute;right:0;top:-3px;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  border-left:6px solid #E31D38;
}

.sub{font-size:15px;color:#888;line-height:1.8;font-weight:500;margin-bottom:52px}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 28px;
  background:#1A1A1A;color:#fff;
  border-radius:999px;
  font-size:13px;font-weight:800;
  text-decoration:none;letter-spacing:.02em;
  transition:all .22s cubic-bezier(.16,1,.3,1);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.btn:hover{background:#E31D38;transform:translateY(-2px);box-shadow:0 8px 24px rgba(227,29,56,.25)}
.btn:hover .bi{transform:translateX(3px)}
.bi{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;transition:transform .18s}

.meta{
  position:fixed;bottom:36px;left:0;right:0;text-align:center;
  font-size:11px;color:#C8C7C5;letter-spacing:.07em;font-weight:600;z-index:1;
}
</style>
</head>
<body data-hh-mode="direct">

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="frame"></div>

<div class="center">
  <div class="wordmark">DRB Industrial</div>
  <div class="title" style="color: rgb(227, 29, 56);">DRB <span style="color: #000;">팀C2B</span></div>
  <div class="row">
    <span class="tag">Chain</span>
    <span class="arrow"></span>
    <span class="tag">Belt</span>
  </div>
  <p class="sub" data-hs=""><span style="color: #e31d38; font-weight: 700;">FUTURE LABS</span>와 연결하여, 기술의 가능성을 비즈니스로 실현합니다.</p>
  <a class="btn" href="C2B_INTRO.html">
    시작하기
    <svg class="bi" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
  </a>
</div>

<div class="meta">DRB 팀C2B &nbsp;·&nbsp; 2026</div>



</body></html>
