<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 활동 — DRB C2B</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --red:#E31D38;--red-deep:#B7182E;--red-soft:#FDF0F1;
  --gray:#706F72;--gray-soft:#F5F5F4;
  --gold:#8C7750;--gold-soft:#F7F3EC;
  --text:#1A1A1A;--text2:#555;--text3:#999;--text4:#BDBBB9;
  --border:#E8E8E6;--card:#fff;--bg:#FAFAF8;
  --sidebar-w:232px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;word-break:keep-all;overflow:hidden}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--card);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:transform .3s}
.sidebar.closed{transform:translateX(calc(var(--sidebar-w)*-1))}
.sb-head{padding:28px 22px 20px;border-bottom:1px solid var(--border)}
.sb-logo-wrap{text-decoration:none;display:block}
.sb-logo{font-size:18px;font-weight:900;letter-spacing:-.04em;color:var(--red);transition:opacity .15s}
.sb-logo-wrap:hover .sb-logo{opacity:.7}
.sb-logo span{color:var(--gray)}
.sb-sub{font-size:11px;color:var(--text3);margin-top:4px}
.sb-nav{flex:1;overflow-y:auto;padding:20px 14px}
.nav-label{font-size:10px;font-weight:800;color:#ccc;letter-spacing:.1em;text-transform:uppercase;padding:0 10px;margin-bottom:8px}
.nav-a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:all .15s;margin-bottom:3px}
.nav-a:hover{background:var(--gray-soft);color:var(--text)}
.nav-a.active{background:var(--red-soft);color:var(--red);font-weight:800}
.nav-n{width:22px;height:22px;border-radius:7px;background:var(--gray-soft);color:var(--text3);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-a.active .nav-n{background:var(--red);color:#fff}
.sb-btn{position:fixed;top:16px;left:16px;z-index:200;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:left .3s}
.sb-btn.sh{left:calc(var(--sidebar-w) + 14px)}
.sb-btn svg{width:16px;height:16px;stroke:var(--gray);stroke-width:2;fill:none;stroke-linecap:round}

/* MAIN */
.main{padding:36px 40px 32px calc(var(--sidebar-w) + 40px);transition:padding-left .3s;min-height:100vh;display:flex;flex-direction:column;position:relative}
.main.exp{padding-left:40px}

/* HEADER */
.hdr{flex-shrink:0;margin-bottom:28px;animation:slideDown .55s cubic-bezier(.16,1,.3,1) both}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.pg-eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.pg-eyebrow::after{content:'';flex:1;max-width:160px;height:1px;background:var(--border)}
.pg-title{font-size:30px;font-weight:800;letter-spacing:-.045em;color:var(--text);line-height:1.15;margin-bottom:6px}
.pg-sub{font-size:13.5px;color:var(--text3);line-height:1.55}

/* GRID */
.grid{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-content:start}
.card:nth-child(1){grid-column:1 / span 4}
.card:nth-child(2){grid-column:5 / span 4}
.card:nth-child(3){grid-column:9 / span 4}
.card:nth-child(4){grid-column:3 / span 4}
.card:nth-child(5){grid-column:7 / span 4}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px 22px 22px;cursor:pointer;display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:200px;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s,border-color .25s;animation:cardIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.15s}.card:nth-child(2){animation-delay:.22s}.card:nth-child(3){animation-delay:.29s}.card:nth-child(4){animation-delay:.36s}.card:nth-child(5){animation-delay:.43s}
.card:hover{transform:translateY(-3px);border-color:#D0CECC;box-shadow:0 12px 32px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.card:hover::before{transform:scaleX(1)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-num{font-size:10.5px;font-weight:900;letter-spacing:.16em;color:var(--red)}
.card-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--text4);text-transform:uppercase}
.card-title{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.28;margin-bottom:10px}
.card-brief{font-size:13px;color:var(--text2);line-height:1.65;flex:1}
.card-cta{margin-top:14px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--text3);transition:color .2s}
.card:hover .card-cta{color:var(--red)}
.card-cta svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.card:hover .card-cta svg{transform:translateX(3px)}

/* ── POPUP ── */
.popup{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.94);
  width:min(520px,calc(100vw - 40px));
  max-height:88vh;
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:0;
  box-shadow:0 28px 72px rgba(0,0,0,.18),0 6px 20px rgba(0,0,0,.06);
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s cubic-bezier(.16,1,.3,1),width .25s;
  z-index:300;overflow:hidden;
  display:flex;flex-direction:column;
}
.popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.popup::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--red-deep));opacity:0;transition:opacity .3s;z-index:1}
.popup.show::before{opacity:1}
.popup-head{padding:24px 28px 18px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.pop-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:10px;background:var(--gray-soft);border:1px solid var(--border);cursor:pointer;font-size:15px;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .15s}
.pop-close:hover{background:var(--red-soft);color:var(--red);border-color:rgba(227,29,56,.25)}
.pop-num{display:inline-block;padding:3px 10px;border-radius:6px;background:var(--red-soft);color:var(--red);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.pop-title{font-size:22px;font-weight:800;letter-spacing:-.035em;color:var(--text);line-height:1.2}
.popup-body{padding:20px 28px 22px;overflow-y:auto;flex:1;min-height:0}
.popup-foot{padding:14px 28px;background:#FAFAF8;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}
.pop-counter{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.04em}
.pop-counter b{color:var(--text);font-weight:900;font-size:13px}
.pop-nav{display:flex;gap:8px}
.pop-nav button{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.pop-nav button:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#fff}
.pop-nav button:disabled{opacity:.3;cursor:not-allowed}
.pop-nav button svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* Backdrop */
.backdrop{position:fixed;inset:0;background:rgba(20,20,22,.4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:250}
.backdrop.show{opacity:1;pointer-events:auto}

/* Keyboard hint */
.kbd-hint{position:fixed;bottom:18px;right:24px;z-index:5;font-size:10px;color:var(--text3);letter-spacing:.04em;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:999px;padding:6px 14px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--card);font-size:9.5px;font-weight:700;color:var(--text2)}

/* ──────────────────────────────────
   POPUP CONTENT STYLES
────────────────────────────────── */
.pop-section{margin-bottom:18px}
.pop-section:last-child{margin-bottom:0}
.pop-sec-title{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.pop-sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* KV highlight box */
.pop-kv{background:var(--gray-soft);border-radius:10px;padding:12px 16px}
.pop-kv-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--text3);margin-bottom:4px}
.pop-kv-val{font-size:15px;color:var(--text);line-height:1.45}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;border:1px solid var(--border)}
.pop-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:280px}
.pop-table th{background:var(--gray-soft);padding:8px 11px;text-align:left;font-weight:700;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.pop-table th:last-child{border-right:none}
.pop-table td{padding:8px 11px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);color:var(--text2);line-height:1.55;vertical-align:top}
.pop-table td:last-child{border-right:none}
.pop-table tr:last-child td{border-bottom:none}
.pop-table .good{color:#1f7a4d;font-weight:600}
.pop-table .bad{color:var(--red);font-weight:600}
.ta-c{text-align:center}

/* Badges */
.pct-badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:800}
.pct-1{background:var(--red-soft);color:var(--red)}
.pct-2{background:var(--gold-soft);color:var(--gold)}
.pct-3{background:var(--gray-soft);color:var(--text2)}

/* Bar chart */
.bar-group{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:12.5px;font-weight:600;color:var(--text2);width:76px;flex-shrink:0}
.bar-track{flex:1;height:9px;background:#EDEDEB;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.bar-pct{font-size:12px;font-weight:700;color:var(--text2);width:30px;text-align:right;flex-shrink:0}

/* Note */
.pop-note{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.55}

/* Alert box */
.pop-alert{display:flex;gap:11px;background:#FFF5F6;border:1px solid rgba(227,29,56,.22);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--text2);line-height:1.6}
.pop-alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}

/* Chain SVG */
.chain-svg-wrap{background:var(--gray-soft);border-radius:10px;padding:14px 14px 10px;margin-bottom:8px}
.chain-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-weight:600;color:var(--text2)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

/* Competitor table */
.co-gates{color:#0055AA;font-weight:700}
.co-conti{color:#E05A00;font-weight:700}
.co-mega{color:#1A8A3C;font-weight:700}
.comp-table td:first-child{white-space:nowrap}

/* Switch grid (Card 4) */
.switch-grid{display:flex;flex-direction:column;gap:10px}
.switch-item{border:1px solid var(--border);border-left-width:3px;border-radius:12px;padding:12px 14px}
.sw-high{border-left-color:var(--red)}
.sw-mid{border-left-color:var(--gold)}
.sw-caution{border-left-color:#F59E0B}
.sw-low{border-left-color:var(--text4)}
.sw-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:5px}
.sw-icon{width:36px;height:36px;border-radius:8px;background:var(--gray-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.sw-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:3px}
.sw-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
.sw-badge.high{background:var(--red-soft);color:var(--red)}
.sw-badge.mid{background:var(--gold-soft);color:var(--gold)}
.sw-badge.caution{background:#FFFBEB;color:#D97706}
.sw-badge.low{background:var(--gray-soft);color:var(--text3)}
.sw-desc{font-size:12px;color:var(--text2);line-height:1.65;padding-left:46px}

/* Test table */
.pop-table.vtbl td:first-child{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;background:var(--gray-soft);width:82px}

/* Status badge */
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:#EFF6FF;color:#1D4ED8}
.status-dot{width:6px;height:6px;border-radius:50%;background:#1D4ED8;animation:blink 1.6s ease infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* Pop facts */
.pop-facts{list-style:none;display:flex;flex-direction:column;gap:10px}
.pop-facts li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text2);line-height:1.65}
.pop-facts li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:8px}
.pop-facts b{color:var(--text);font-weight:700}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(6,1fr)}
  .card:nth-child(1){grid-column:1 / span 3}.card:nth-child(2){grid-column:4 / span 3}
  .card:nth-child(3){grid-column:1 / span 3}.card:nth-child(4){grid-column:4 / span 3}
  .card:nth-child(5){grid-column:2 / span 4}
}
@media(max-width:860px){.main{padding-left:40px}.sidebar{transform:translateX(calc(var(--sidebar-w)*-1))}.sb-btn,.sb-btn.sh{left:16px}}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;gap:10px}
  .card,.card:nth-child(n){grid-column:1}
  .popup-head{padding:18px 18px 14px}
  .popup-body{padding:16px 18px 18px}
  .popup-foot{padding:12px 18px}
}
</style>
</head>

<!-- ============================================================
  POPUP CONTENT TEMPLATES
============================================================ -->

<!-- 01 체인시장 분석 -->
<template id="tpl-market">
  <div class="pop-section">

  </div>
  <div class="pop-section">

          <tr>

          </tr>
          <tr>

            <td class="ta-c"><span class="pct-badge pct-3">약 22%</span></td>

          </tr>
        </tbody>
      </table>
    </div>

  </div>

    <div class="bar-group">
      <div class="bar-row">
        <span class="bar-label">롤러체인</span>
        <div class="bar-track"><div class="bar-fill" style="width:62%;background:var(--red)"></div></div>
        <span class="bar-pct">62%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">리프트체인</span>

        <span class="bar-pct">24%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">기타</span>

        <span class="bar-pct">14%</span>
      </div>
    </div>
  </div>
</template>

<!-- 02 체인 구조 이해 -->
<template id="tpl-structure">
  <div class="pop-section">
    <div class="pop-sec-title">롤러체인 구조</div>
    <div class="chain-svg-wrap">
      <!-- Side view: 2 outer + 1 inner pitch, pitch=110px, cy=75, outer half-h=24, inner half-h=20 -->
      <svg viewBox="0 0 430 138" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
        <!-- Outer link 1: pin1(55) → pin2(165) -->
        <path d="M 55,51 H 165 A 24,24 0 0 1 165,99 H 55 A 24,24 0 0 1 55,51 Z"
              fill="#D0CECC" stroke="#706F72" stroke-width="1.5"/>
        <!-- Inner link: pin2(165) → pin3(275) -->
        <path d="M 165,55 H 275 A 20,20 0 0 1 275,95 H 165 A 20,20 0 0 1 165,55 Z"
              fill="#E8E8E6" stroke="#AAAAAA" stroke-width="1.2"/>
        <!-- Outer link 2: pin3(275) → pin4(385) -->
        <path d="M 275,51 H 385 A 24,24 0 0 1 385,99 H 275 A 24,24 0 0 1 275,51 Z"
              fill="#D0CECC" stroke="#706F72" stroke-width="1.5"/>

        <!-- Roller / Bushing / Pin @ pin1(55,75) -->
        <circle cx="55" cy="75" r="20" fill="white" stroke="#E31D38" stroke-width="2.2"/>
        <circle cx="55" cy="75" r="12" fill="#F7F3EC" stroke="#8C7750" stroke-width="2"/>
        <circle cx="55" cy="75" r="5" fill="#706F72"/>
        <!-- @ pin2(165,75) -->
        <circle cx="165" cy="75" r="20" fill="white" stroke="#E31D38" stroke-width="2.2"/>
        <circle cx="165" cy="75" r="12" fill="#F7F3EC" stroke="#8C7750" stroke-width="2"/>
        <circle cx="165" cy="75" r="5" fill="#706F72"/>
        <!-- @ pin3(275,75) -->
        <circle cx="275" cy="75" r="20" fill="white" stroke="#E31D38" stroke-width="2.2"/>
        <circle cx="275" cy="75" r="12" fill="#F7F3EC" stroke="#8C7750" stroke-width="2"/>
        <circle cx="275" cy="75" r="5" fill="#706F72"/>
        <!-- @ pin4(385,75) -->
        <circle cx="385" cy="75" r="20" fill="white" stroke="#E31D38" stroke-width="2.2"/>
        <circle cx="385" cy="75" r="12" fill="#F7F3EC" stroke="#8C7750" stroke-width="2"/>
        <circle cx="385" cy="75" r="5" fill="#706F72"/>

        <!-- Label: 롤러 -->
        <line x1="43" y1="58" x2="22" y2="20" stroke="#E31D38" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="20" y="15" text-anchor="middle" font-size="11" font-weight="700"
              fill="#E31D38" font-family="Pretendard,system-ui,sans-serif">롤러</text>

        <!-- Label: 부시 -->

<script>
const ACTS = [
  {
    id:'market', num:'01', tag:'Market',
    title:'체인 시장 분석',
    brief:'국내 산업용 체인 시장 규모와 제조사 분석',
    tplId:'tpl-market',
    width:'min(580px,calc(100vw - 40px))'
  },
  {
    id:'structure', num:'02', tag:'Structure',
    title:'체인 구조 이해',
    brief:'Roller Chain 구성·신장 메커니즘과 벨트 전환 이점',
    tplId:'tpl-structure',
    width:'min(640px,calc(100vw - 40px))'
  },
  {
    id:'competitor', num:'03', tag:'Competitor',
    title:'경쟁사 분석',
    brief:'Gates · Continental · Megadyne 폴리우레탄 동기벨트 비교',
    tplId:'tpl-competitor',
    width:'min(780px,calc(100vw - 40px))'
  },
  {
    id:'analysis', num:'04', tag:'Analysis',
    title:'전환 가능성 분석',
    brief:'체인 타입별 전환 적합도 — 이송용·롤러·리프트·특수',
    tplId:'tpl-analysis',
    width:'min(620px,calc(100vw - 40px))'
  },
  {
    id:'test', num:'05', tag:'Field Test',
    title:'실차 테스트',
    brief:'전동 스태커 3종 구성, 1.5톤 실하중 비교 검증 진행 중',
    tplId:'tpl-test',
    width:'min(540px,calc(100vw - 40px))'
  }
];

function renderGrid(){
  document.getElementById('grid').innerHTML = ACTS.map((a,i) => `
    <div class="card" onclick="clickCard('${a.id}')" style="animation-delay:${.15+i*.07}s">
      <div class="card-top">
        <span class="card-num">${a.num}</span>
        <span class="card-tag">${a.tag}</span>
      </div>
      <h3 class="card-title">${a.title}</h3>
      <p class="card-brief">${a.brief}</p>
      <div class="card-cta">
        상세 보기
        <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </div>
    </div>
  `).join('');
}

let idx = -1;

function clickCard(id){
  idx = ACTS.findIndex(a => a.id === id);
  if(idx >= 0) showPopup(ACTS[idx]);
}

function showPopup(a){
  const popup = document.getElementById('popup');
  // Set width per card
  popup.style.width = a.width || 'min(520px,calc(100vw - 40px))';

  document.getElementById('pNum').textContent   = a.num + ' · ' + a.tag;
  document.getElementById('pTitle').textContent = a.title;

  // Load template
  const tpl = document.getElementById(a.tplId);
  document.getElementById('pBody').innerHTML = tpl ? tpl.innerHTML : '';
  // Reset scroll
  document.getElementById('pBody').scrollTop = 0;

  document.getElementById('pCur').textContent    = idx + 1;
  document.getElementById('pPrev').disabled      = idx <= 0;
  document.getElementById('pNext').disabled      = idx >= ACTS.length - 1;

  popup.classList.add('show');
  document.getElementById('backdrop').classList.add('show');
}

function navPopup(dir){
  const next = idx + dir;
  if(next < 0 || next >= ACTS.length) return;
  idx = next;
  showPopup(ACTS[idx]);
}

function closePopup(){
  idx = -1;
  document.getElementById('popup').classList.remove('show');
  document.getElementById('backdrop').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePopup();
  if(e.key === 'ArrowLeft'  && idx > 0)                       navPopup(-1);
  if(e.key === 'ArrowRight' && idx >= 0 && idx < ACTS.length-1) navPopup(1);
});

function tog(){
  const s=document.getElementById('sb'),m=document.getElementById('mn'),b=document.getElementById('sbb');
  s.classList.toggle('closed');m.classList.toggle('exp');b.classList.toggle('sh');
}

renderGrid();
</script>
