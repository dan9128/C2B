<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감사합니다 — DRB C2B</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard',system-ui,sans-serif;
  background:#FAFAF8;
  color:#1A1A1A;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

/* 배경 블롭 */
.blob{position:fixed;pointer-events:none;border-radius:50%}
.b1{
  width:620px;height:620px;top:-180px;right:-160px;
  background:radial-gradient(ellipse,rgba(227,29,56,.06) 0%,transparent 70%);
  animation:float1 12s ease-in-out infinite alternate;
}
.b2{
  width:420px;height:420px;bottom:-120px;left:-100px;
  background:radial-gradient(ellipse,rgba(140,119,80,.06) 0%,transparent 70%);
  animation:float2 14s ease-in-out infinite alternate;
}
@keyframes float1{from{transform:translate(0,0)}to{transform:translate(-30px,20px)}}
@keyframes float2{from{transform:translate(0,0)}to{transform:translate(20px,-25px)}}

/* 외곽 프레임 */
.frame{
  position:fixed;inset:24px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:28px;
  pointer-events:none;
}

/* 중앙 */
.center{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;
  text-align:center;
  padding:0 32px;
  max-width:680px;
  width:100%;
}

.wordmark{
  font-size:11px;font-weight:800;letter-spacing:.22em;
  text-transform:uppercase;color:#BDBBB9;
  margin-bottom:48px;
  display:flex;align-items:center;gap:12px;
  animation:fadeIn .9s cubic-bezier(.16,1,.3,1) both;
}
.wordmark::before,.wordmark::after{content:'';width:24px;height:1px;background:#E0DFDD}

/* 메인 메시지 */
.thanks{
  font-size:clamp(48px,7vw,76px);
  font-weight:900;letter-spacing:-.05em;line-height:1;
  color:#1A1A1A;
  margin-bottom:16px;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .15s;
}
.thanks em{color:#E31D38;font-style:normal}

.sub-en{
  font-size:14px;font-weight:700;letter-spacing:.26em;
  text-transform:uppercase;color:#BDBBB9;
  margin-bottom:48px;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .3s;
}

/* 라인 디바이더 */
.divider{
  width:50px;height:2px;background:#E31D38;
  border-radius:2px;
  margin:0 auto 36px;
  animation:expand .8s cubic-bezier(.16,1,.3,1) both .5s;
}
@keyframes expand{from{width:0;opacity:0}to{width:50px;opacity:1}}

/* 클로징 메시지 */
.closing{
  font-size:17px;color:#555;line-height:1.85;
  font-weight:500;
  max-width:480px;
  margin-bottom:48px;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .55s;
}
.closing b{color:#1A1A1A;font-weight:700}

/* CTA */
.actions{
  display:flex;gap:10px;justify-content:center;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .75s;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;
  border-radius:999px;
  font-size:13px;font-weight:800;letter-spacing:.02em;
  text-decoration:none;
  transition:all .22s cubic-bezier(.16,1,.3,1);
}
.btn-primary{
  background:#1A1A1A;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.btn-primary:hover{background:#E31D38;transform:translateY(-2px);box-shadow:0 8px 24px rgba(227,29,56,.25)}
.btn-primary:hover .bi{transform:translateX(-3px)}
.btn-ghost{
  background:transparent;color:#888;
  border:1px solid #E0DFDD;
}
.btn-ghost:hover{border-color:#1A1A1A;color:#1A1A1A;transform:translateY(-2px)}
.bi{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;transition:transform .18s}
.bi.flip{transform:scaleX(-1)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 하단 메타 */
.meta{
  position:fixed;bottom:36px;left:0;right:0;
  text-align:center;
  font-size:11px;color:#C8C7C5;letter-spacing:.07em;font-weight:600;
  z-index:1;
  animation:fadeIn 1s ease both 1s;
}
.meta b{color:#999;font-weight:700}
</style>
</head>
<body data-hh-mode="direct">

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="frame"></div>

<div class="center">
  <div class="wordmark">DRB Industrial</div>

  <h1 class="thanks" style="color:#000;">감사합<em style="color:#000;">니</em>다</h1>

  <div class="sub-en" style="color: rgb(227, 29, 56);">Thank You</div>

  <div class="divider"></div>

  <p class="closing" data-hs="">가능성에서 시작된 작은 가설&nbsp;<b>사업화의 출발선</b>에 닿기까지.<br>
    함께 들어주셔서 감사합니다.
  </p>

  <div class="actions">
    <a class="btn btn-primary" href="index.html">
      <svg class="bi flip" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
      처음으로
    </a>
    <a class="btn btn-ghost" href="C2B_MAIN.html">활동 다시 보기</a>
  </div>
</div>

<div class="meta">DRB 팀C2B &nbsp;·&nbsp; Chain to Belt 사업화 프로젝트</div>



</body></html>
