<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마무리 — DRB C2B</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard',system-ui,sans-serif;
  background:#ffffff;
  color:#1A1A1A;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

/* 외곽 프레임 */
.frame{position:fixed;inset:24px;border:1px solid rgba(0,0,0,.06);border-radius:28px;pointer-events:none}

/* 중앙 컨테이너 */
.center{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
  padding:0 32px;
  max-width:700px;width:100%;
}

/* 워드마크 */
.wordmark{
  font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:#BDBBB9;margin-bottom:48px;
  display:flex;align-items:center;gap:12px;
  animation:fadeIn .9s cubic-bezier(.16,1,.3,1) both;
}
.wordmark::before,.wordmark::after{content:'';width:24px;height:1px;background:#E0DFDD}

/* ── 다음 질문 블록 ── */
.question-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:#BDBBB9;margin-bottom:16px;
  animation:rise .9s cubic-bezier(.16,1,.3,1) both .1s;
}

.question-body{
  font-size:clamp(20px,3vw,28px);
  font-weight:900;letter-spacing:-.04em;line-height:1.3;
  color:#1A1A1A;
  margin-bottom:36px;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .25s;
}
.question-body em{
  display:block;
  color:#E31D38;
  font-style:normal;
  margin-top:10px;
  font-size:clamp(18px,2.5vw,24px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1.4;
}

/* 디바이더 */
.divider{
  width:48px;height:2px;background:#E31D38;
  border-radius:2px;margin:0 auto 36px;
  animation:expand .8s cubic-bezier(.16,1,.3,1) both .45s;
}
@keyframes expand{from{width:0;opacity:0}to{width:48px;opacity:1}}

/* 클로징 */
.closing{
  font-size:16px;color:#777;line-height:1.9;font-weight:500;
  max-width:460px;margin-bottom:44px;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .55s;
}
.closing b{color:#1A1A1A;font-weight:700}

/* CTA */
.actions{
  display:flex;gap:10px;justify-content:center;
  animation:rise 1s cubic-bezier(.16,1,.3,1) both .7s;
}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.02em;text-decoration:none;transition:all .22s cubic-bezier(.16,1,.3,1)}
.btn-primary{background:#1A1A1A;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.btn-primary:hover{background:#E31D38;transform:translateY(-2px);box-shadow:0 8px 24px rgba(227,29,56,.25)}
.btn-primary:hover .bi{transform:translateX(-3px)}
.btn-ghost{background:transparent;color:#888;border:1px solid #E0DFDD}
.btn-ghost:hover{border-color:#1A1A1A;color:#1A1A1A;transform:translateY(-2px)}
.bi{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;transition:transform .18s}

/* 하단 메타 */
.meta{
  position:fixed;bottom:36px;left:0;right:0;text-align:center;
  font-size:11px;color:#C8C7C5;letter-spacing:.07em;font-weight:600;z-index:1;
  animation:fadeIn 1s ease both 1s;
}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

  50%{border-radius:50% 50% 30% 70% / 50% 70% 30% 50%}
  100%{border-radius:70% 30% 50% 50% / 30% 70% 50% 50%}
}

/* ── 사선 줄무늬 배경 ── */
.sb-stripe{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 28px,
    rgba(0,0,0,.022) 28px,
    rgba(0,0,0,.022) 29px
  );
}
.sb-corner1{
  position:fixed;top:0;right:0;pointer-events:none;z-index:0;
  width:480px;height:480px;
  background:radial-gradient(ellipse at 100% 0%,rgba(227,29,56,.09) 0%,transparent 65%);
}
.sb-corner2{
  position:fixed;bottom:0;left:0;pointer-events:none;z-index:0;
  width:340px;height:340px;
  background:radial-gradient(ellipse at 0% 100%,rgba(227,29,56,.06) 0%,transparent 65%);
}
</style>
</head>
<body data-hh-mode="direct">
<div class="sb-stripe"></div>
<div class="sb-corner1"></div>
<div class="sb-corner2"></div>

<div class="frame"></div>

<div class="center">
  <div class="wordmark" data-hs="">비즈니스 팀C2B</div>

  <div class="question-eyebrow"><br></div>

  <div class="question-body">
    <span style="font-size: 18px;"><span style="font-size: 18px;"><span style="font-size: 18px;"><span style="font-size: 56px;"><span style="font-size: 58px;"><span style="font-size: 58px;"><span style="font-size: 58px;">감사합니다.</span></span></span></span></span></span></span></div>

  <div class="divider"></div>

  <p class="closing">우리의 질문에서 출발한 아이디어를<br data-start="109" data-end="112">
실제 비즈니스로 연결하겠습니다.</p>

  <div class="actions">
    <a class="btn btn-primary" href="index.html">
      <svg class="bi" style="transform:scaleX(-1)" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
      처음으로
    </a>
    <a class="btn btn-ghost" href="C2B_MAIN.html">활동 다시 보기</a>
  </div>
</div>

<div class="meta">DRB 팀C2B &nbsp;·&nbsp; Chain to Belt 사업화 프로젝트 &nbsp;·&nbsp; 2026</div>


</body></html>
